version: 2

# NuGet 依存と GitHub Actions の週次更新。
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # マイナー / パッチは 1 PR にまとめてレビュー負荷を減らす。
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
