name: CI

# build + test。Windows / Linux の双方を同じ固定 gate とする。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 ref の古い実行をキャンセルして CI 時間を節約する。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Yatagarasu.slnx

      - name: Build
        run: dotnet build Yatagarasu.slnx --configuration Release --no-restore

      - name: Verify zero-dependency core package
        shell: pwsh
        run: ./scripts/verify-zero-dependency.ps1 -Configuration Release

      - name: Test
        run: dotnet test Yatagarasu.slnx --configuration Release --no-build --verbosity normal
