name: CI

# CI-1: build + test。段階導入のため初期は windows-latest 単独で緑化し、
# 安定後に matrix へ ubuntu-latest を追加する (tasks/ops.md CI-1 の方針)。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 ref の古い実行をキャンセルして CI 時間を節約する。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 段階導入: まず windows-latest のみ。Linux 固有の差分 (path 区切り /
        # MMF 挙動 / 大文字小文字) を潰してから後続 PR で ubuntu-latest を足す。
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Quiver.slnx

      - name: Build
        run: dotnet build Quiver.slnx --configuration Release --no-restore

      - name: Verify zero-dependency core package
        shell: pwsh
        run: ./scripts/verify-zero-dependency.ps1 -Configuration Release

      - name: Test
        run: dotnet test Quiver.slnx --configuration Release --no-build --verbosity normal
